services:
  client-app:
    env_file:
      - path: "./.env"
    build:
      context: .
      dockerfile: ./Dockerfile
    develop:
      watch:
        - action: sync
          path: ./
          target: ./app
          ignore:
            - ./package.json

        - action: rebuild
          path: ./package.json
    ports:
      - "3400:3400"
